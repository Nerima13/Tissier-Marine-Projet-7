<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>User List Screen</title>
    <link rel="stylesheet" type="text/css" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container">

    <!-- Menu + logged-in user -->
    <div class="row" style="margin-bottom: 20px;">
        <div class="col-md-6">
            <a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
            <a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
            <a href="/rating/list">Ratings</a>&nbsp;|&nbsp;
            <a href="/trade/list">Trade</a>&nbsp;|&nbsp;
            <a href="/ruleName/list">Rule</a>&nbsp;|&nbsp;
            <a href="/user/list">Users</a>
        </div>

        <div class="col-md-6 text-right">
            <div>
                Logged in user :
                <span th:text="${username}">admin</span>
            </div>

            <div style="margin-top: 5px;">
                <!-- User Management button (ADMIN only) -->
                <form th:if="${isAdmin}"
                      th:action="@{/user/list}" method="get"
                      style="display:inline-block; margin-right:8px;">
                    <button type="submit"
                            style="background-color: #f8f9fa;
                   border: 1px solid #999;
                   padding: 3px 12px;
                   font-size: 14px;
                   cursor: pointer;">
                        User Management
                    </button>
                </form>

                <!-- Logout button -->
                <form th:action="@{/logout}" method="post" style="display:inline-block;">
                    <button type="submit"
                            style="background-color: #f8f9fa;
                                   border: 1px solid #999;
                                   padding: 3px 12px;
                                   font-size: 14px;
                                   cursor: pointer;">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Section title -->
    <div class="row">
        <div class="col-md-12">
            <h2>User List</h2>
        </div>
    </div>

    <!-- Button + table -->
    <div class="row">
        <div class="col-md-12">
            <a href="/user/add" class="btn btn-primary btn-sm">Add New</a>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Full Name</th>
                    <th>User Name</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td style="width: 10%" th:text="${user.id}"></td>
                    <td th:text="${user.fullname}"></td>
                    <td th:text="${user.username}"></td>
                    <td style="width: 25%" th:text="${user.role}"></td>
                    <td style="width: 15%" class="text-center">
                        <a th:href="@{/user/update/{id}(id=${user.id})}">Edit</a>&nbsp;|&nbsp;
                        <a th:href="@{/user/delete/{id}(id=${user.id})}">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
