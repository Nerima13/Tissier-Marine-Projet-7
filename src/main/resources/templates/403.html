<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Spring Boot - Access Denied</title>
</head>
<body>
<h3>Access Denied Exception</h3>

<div>
    Logged in user:
    <!-- Safely display the username only if the HttpServletRequest is available -->
    <b class="user"
       th:if="${#httpServletRequest != null}"
       th:text="${#httpServletRequest.remoteUser}">User</b>
    <b class="user"
       th:unless="${#httpServletRequest != null}">Anonymous</b>

    <form th:action="@{/logout}" method="post">
        <input type="submit" value="Logout"/>
    </form>
</div>

<p class="error"
   th:text="${errorMsg} ?: 'You are not authorized to access this page.'">
    Error
</p>
</body>
</html>
