<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Rating List Screen</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container">

    <!-- Menu + logged-in user -->
    <div class="row" style="margin-bottom: 20px;">
        <div class="col-md-6">
            <a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
            <a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
            <a href="/rating/list">Ratings</a>&nbsp;|&nbsp;
            <a href="/trade/list">Trade</a>&nbsp;|&nbsp;
            <a href="/ruleName/list">Rule</a>
        </div>

        <div class="col-md-6 text-right">
            <div>
                Logged in user :
                <span th:text="${username}">admin</span>
            </div>
            <form th:action="@{/logout}" method="post" style="margin-top: 5px;">
                <button type="submit"
                        style="background-color: #f8f9fa;
                               border: 1px solid #999;
                               padding: 3px 12px;
                               font-size: 14px;
                               cursor: pointer;">
                    Logout
                </button>
            </form>
        </div>
    </div>

    <!-- Section title -->
    <div class="row">
        <div class="col-md-12">
            <h2>Rating List</h2>
        </div>
    </div>

    <!-- Button + table -->
    <div class="row">
        <div class="col-md-12">
            <a href="/rating/add" class="btn btn-primary btn-sm">Add New</a>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>MoodysRating</th>
                    <th>SandPRating</th>
                    <th>FitchRating</th>
                    <th>Order</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rating : ${ratings}">
                    <td style="width: 10%" th:text="${rating.id}"></td>
                    <td th:text="${rating.moodysRating}"></td>
                    <td th:text="${rating.sandPRating}"></td>
                    <td th:text="${rating.fitchRating}"></td>
                    <td th:text="${rating.orderNumber}"></td>
                    <td style="width: 15%" class="text-center">
                        <a th:href="@{/rating/update/{id}(id=${rating.id})}">Edit</a>&nbsp;|&nbsp;
                        <a th:href="@{/rating/delete/{id}(id=${rating.id})}">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
